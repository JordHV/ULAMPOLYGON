<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ulam Spiral</title>
  <style>
    :root {
      --bg: #1a1f24;
      --panel: #242b33;
      --ink: #e8eef4;
      --muted: #9aa8b5;
      --accent: #3d9b8f;
      --line: #6b7c8c;
      --prime: #e8c47c;
      --prime-collinear: #e85d5d;
      --prime-full-line: #4caf7a;
      --border: #3a4550;
      --danger: #d67a7a;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, #2a3540 0%, transparent 50%),
        radial-gradient(ellipse at 100% 100%, #1e2a28 0%, transparent 45%),
        var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:
        max(0.75rem, env(safe-area-inset-top))
        max(0.75rem, env(safe-area-inset-right))
        max(0.75rem, env(safe-area-inset-bottom))
        max(0.75rem, env(safe-area-inset-left));
      gap: 0.75rem;
    }

    h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(1.15rem, 4vw, 1.75rem);
      letter-spacing: 0.02em;
      text-align: center;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      align-items: flex-end;
      justify-content: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      max-width: 960px;
      width: 100%;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.8rem;
      color: var(--muted);
      min-width: 9.5rem;
      flex: 1 1 9.5rem;
    }

    label.toggle {
      flex-direction: row;
      align-items: center;
      gap: 0.65rem;
      min-height: 2.75rem;
      align-self: flex-end;
      cursor: pointer;
      user-select: none;
    }

    label.toggle input {
      width: 1.15rem;
      height: 1.15rem;
      accent-color: var(--prime-collinear);
      cursor: pointer;
      flex-shrink: 0;
    }

    label.toggle.full-line input {
      accent-color: var(--prime-full-line);
    }

    label.toggle span {
      color: var(--ink);
      font-size: 0.85rem;
      line-height: 1.25;
    }

    .highlight-stats {
      display: none;
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.35;
    }

    .highlight-stats.is-visible {
      display: block;
    }

    .highlight-stats strong {
      color: var(--ink);
      font-weight: 600;
    }

    .stepper {
      display: flex;
      align-items: stretch;
      width: 100%;
      min-height: 2.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg);
    }

    .stepper:focus-within {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .stepper input[type="number"] {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      border: none;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      padding: 0.55rem 0.4rem;
      font-size: 16px;
      text-align: center;
      min-height: 2.75rem;
      -webkit-appearance: none;
      appearance: textfield;
      margin: 0;
    }

    .stepper input[type="number"]::-webkit-outer-spin-button,
    .stepper input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .stepper input[type="number"]:focus {
      outline: none;
    }

    .step {
      flex: 0 0 2.75rem;
      width: 2.75rem;
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
    }

    .step:hover { background: rgba(61, 155, 143, 0.18); }
    .step:active { background: rgba(61, 155, 143, 0.28); }
    .step:disabled {
      opacity: 0.35;
      cursor: default;
      background: transparent;
    }

    .error {
      color: var(--danger);
      font-size: 0.9rem;
      min-height: 1.1rem;
      text-align: center;
      padding: 0 0.25rem;
      max-width: 36rem;
    }

    .canvas-wrap {
      width: min(920px, 100%);
      max-width: 100%;
      background: #0e1216;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 1;
      flex-shrink: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      max-width: 40rem;
      margin: 0;
      line-height: 1.35;
      padding: 0 0.25rem;
    }

    @media (max-width: 480px) {
      body {
        gap: 0.55rem;
        padding:
          max(0.55rem, env(safe-area-inset-top))
          max(0.55rem, env(safe-area-inset-right))
          max(0.55rem, env(safe-area-inset-bottom))
          max(0.55rem, env(safe-area-inset-left));
      }

      .hint {
        font-size: 0.78rem;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.65rem;
        padding: 0.75rem;
      }

      label {
        min-width: 0;
        flex: none;
      }

      label.toggle {
        grid-column: 1 / -1;
        align-self: stretch;
        min-height: 2.5rem;
      }

      .step {
        flex-basis: 2.5rem;
        width: 2.5rem;
      }

      .error {
        font-size: 0.82rem;
        min-height: 0.95rem;
      }

      .canvas-wrap {
        width: min(100%, calc(100dvh - 13.5rem));
        max-height: calc(100dvh - 13.5rem);
      }
    }

    @media (max-width: 380px) {
      .canvas-wrap {
        width: min(100%, calc(100dvh - 14.5rem));
        max-height: calc(100dvh - 14.5rem);
      }
    }
  </style>
</head>
<body>
  <h1>Ulam Spiral</h1>
  <p class="hint">Spiral path as a line; hollow circles mark primes. Edges set the polygon (3 = triangle, 4 = square, …). Turn on collinear highlight to mark primes red when 10+ of them share a straight line.</p>

  <form class="controls" id="form" novalidate>
    <label>
      Start (center)
      <div class="stepper">
        <button type="button" class="step" data-for="start" data-delta="-1" aria-label="Decrease start">−</button>
        <input type="number" id="start" min="1" step="1" value="1" required />
        <button type="button" class="step" data-for="start" data-delta="1" aria-label="Increase start">+</button>
      </div>
    </label>
    <label>
      Edges
      <div class="stepper">
        <button type="button" class="step" data-for="edges" data-delta="-1" aria-label="Decrease edges">−</button>
        <input type="number" id="edges" min="3" max="100" step="1" value="4" required />
        <button type="button" class="step" data-for="edges" data-delta="1" aria-label="Increase edges">+</button>
      </div>
    </label>
    <label>
      Increment
      <div class="stepper">
        <button type="button" class="step" data-for="increment" data-delta="-1" aria-label="Decrease increment">−</button>
        <input type="number" id="increment" min="1" step="1" value="1" required />
        <button type="button" class="step" data-for="increment" data-delta="1" aria-label="Increase increment">+</button>
      </div>
    </label>
    <label>
      Max increments
      <div class="stepper">
        <button type="button" class="step" data-for="maxIncrements" data-delta="-1" aria-label="Decrease max increments">−</button>
        <input type="number" id="maxIncrements" min="1" step="1" value="500" required />
        <button type="button" class="step" data-for="maxIncrements" data-delta="1" aria-label="Increase max increments">+</button>
      </div>
    </label>
    <label class="toggle" for="collinearHighlight">
      <input type="checkbox" id="collinearHighlight" />
      <span>Highlight collinear primes (10+)</span>
    </label>
    <label class="toggle full-line" for="fullLineHighlight">
      <input type="checkbox" id="fullLineHighlight" />
      <span>Highlight fully prime lines</span>
    </label>
  </form>

  <p class="highlight-stats" id="highlightStats" aria-live="polite"></p>
  <p class="error" id="error" aria-live="polite"></p>

  <div class="canvas-wrap">
    <canvas id="canvas" width="900" height="900"></canvas>
  </div>

  <script>
    (function () {
      const form = document.getElementById("form");
      const errorEl = document.getElementById("error");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const fields = {
        start: document.getElementById("start"),
        edges: document.getElementById("edges"),
        increment: document.getElementById("increment"),
        maxIncrements: document.getElementById("maxIncrements"),
      };
      const collinearToggle = document.getElementById("collinearHighlight");
      const fullLineToggle = document.getElementById("fullLineHighlight");
      const highlightStats = document.getElementById("highlightStats");
      const COLLINEAR_MIN = 10;
      let lastPoints = null;

      function syncCanvasSize() {
        const wrap = canvas.parentElement;
        const cssSize = Math.max(1, Math.floor(wrap.clientWidth || 300));
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        const px = Math.round(cssSize * dpr);
        if (canvas.width !== px || canvas.height !== px) {
          canvas.width = px;
          canvas.height = px;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return cssSize;
      }

      function isPrime(n) {
        if (n < 2) return false;
        if (n % 2 === 0) return n === 2;
        if (n % 3 === 0) return n === 3;
        for (let i = 5; i * i <= n; i += 6) {
          if (n % i === 0 || n % (i + 2) === 0) return false;
        }
        return true;
      }

      function parsePositiveInt(el, name, min, max) {
        const raw = el.value.trim();
        if (raw === "" || !/^\d+$/.test(raw)) {
          throw new Error(name + " must be a positive integer.");
        }
        const n = Number(raw);
        if (!Number.isInteger(n) || n < min) {
          throw new Error(name + " must be an integer ≥ " + min + ".");
        }
        if (max != null && n > max) {
          throw new Error(name + " must be ≤ " + max + ".");
        }
        return n;
      }

      function fieldBounds(el) {
        const min = el.min !== "" ? Number(el.min) : 1;
        const max = el.max !== "" ? Number(el.max) : null;
        return { min, max };
      }

      function updateStepButtons(el) {
        const { min, max } = fieldBounds(el);
        const n = Number(el.value);
        const valid = Number.isInteger(n);
        form.querySelectorAll('.step[data-for="' + el.id + '"]').forEach(function (btn) {
          const delta = Number(btn.dataset.delta);
          if (!valid) {
            btn.disabled = false;
            return;
          }
          if (delta < 0) btn.disabled = n <= min;
          else if (max != null) btn.disabled = n >= max;
          else btn.disabled = false;
        });
      }

      function syncAllStepButtons() {
        Object.keys(fields).forEach(function (id) {
          updateStepButtons(fields[id]);
        });
      }

      /** Polygonal Ulam-like path: N directions; length grows every floor(N/2) sides (classic square when N=4). */
      function buildSpiral(start, edges, increment, maxIncrements) {
        const points = [];
        let x = 0;
        let y = 0;
        let value = start;
        points.push({ x, y, value, prime: isPrime(value) });

        const dirs = [];
        for (let i = 0; i < edges; i++) {
          const angle = (2 * Math.PI * i) / edges;
          dirs.push({ dx: Math.cos(angle), dy: -Math.sin(angle) });
        }

        const sidesBeforeGrow = Math.max(1, Math.floor(edges / 2));
        let dirIndex = 0;
        let sideLength = 1;
        let sidesDrawn = 0;
        let stepsLeft = maxIncrements;

        while (stepsLeft > 0) {
          const dir = dirs[dirIndex % edges];
          const stepsThisSide = Math.min(sideLength, stepsLeft);
          for (let s = 0; s < stepsThisSide; s++) {
            x += dir.dx;
            y += dir.dy;
            value += increment;
            points.push({ x, y, value, prime: isPrime(value) });
          }
          stepsLeft -= stepsThisSide;
          dirIndex += 1;
          sidesDrawn += 1;
          if (sidesDrawn >= sidesBeforeGrow) {
            sidesDrawn = 0;
            sideLength += 1;
          }
        }

        return points;
      }

      /** Indices of primes that lie on at least one line with ≥ minCount primes. */
      function findCollinearPrimeIndices(points, minCount) {
        const primes = [];
        for (let i = 0; i < points.length; i++) {
          if (points[i].prime) primes.push(i);
        }
        if (primes.length < minCount) return new Set();

        const highlighted = new Set();
        const eps = 1e-9;
        const n = primes.length;

        for (let i = 0; i < n; i++) {
          const groups = new Map();
          const pi = points[primes[i]];
          for (let j = 0; j < n; j++) {
            if (i === j) continue;
            const pj = points[primes[j]];
            let dx = pj.x - pi.x;
            let dy = pj.y - pi.y;
            if (Math.abs(dx) < eps && Math.abs(dy) < eps) continue;
            const len = Math.hypot(dx, dy);
            dx /= len;
            dy /= len;
            if (dx < -eps || (Math.abs(dx) < eps && dy < 0)) {
              dx = -dx;
              dy = -dy;
            }
            const key = Math.round(dx * 1e6) + "," + Math.round(dy * 1e6);
            let group = groups.get(key);
            if (!group) {
              group = [primes[i]];
              groups.set(key, group);
            }
            group.push(primes[j]);
          }
          for (const group of groups.values()) {
            if (group.length < minCount) continue;
            for (let k = 0; k < group.length; k++) highlighted.add(group[k]);
          }
        }

        return highlighted;
      }

      /** Indices of primes that lie on a line where every spiral node on that line is prime. */
      function findFullyPrimeLineIndices(points) {
        const highlighted = new Set();
        const n = points.length;
        if (n < 2) return highlighted;

        const eps = 1e-9;

        for (let i = 0; i < n; i++) {
          const groups = new Map();
          const pi = points[i];
          for (let j = 0; j < n; j++) {
            if (i === j) continue;
            const pj = points[j];
            let dx = pj.x - pi.x;
            let dy = pj.y - pi.y;
            if (Math.abs(dx) < eps && Math.abs(dy) < eps) continue;
            const len = Math.hypot(dx, dy);
            dx /= len;
            dy /= len;
            if (dx < -eps || (Math.abs(dx) < eps && dy < 0)) {
              dx = -dx;
              dy = -dy;
            }
            const key = Math.round(dx * 1e6) + "," + Math.round(dy * 1e6);
            let group = groups.get(key);
            if (!group) {
              group = [i];
              groups.set(key, group);
            }
            group.push(j);
          }
          for (const group of groups.values()) {
            if (group.length < 2) continue;
            let allPrime = true;
            for (let k = 0; k < group.length; k++) {
              if (!points[group[k]].prime) {
                allPrime = false;
                break;
              }
            }
            if (!allPrime) continue;
            for (let k = 0; k < group.length; k++) highlighted.add(group[k]);
          }
        }

        return highlighted;
      }

      function draw(points) {
        lastPoints = points;
        const cssSize = syncCanvasSize();
        const w = cssSize;
        const h = cssSize;
        ctx.clearRect(0, 0, w, h);

        if (!points || points.length === 0) return;

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (const p of points) {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        }

        const pad = Math.max(12, Math.min(28, cssSize * 0.04));
        const spanX = Math.max(maxX - minX, 1e-9);
        const spanY = Math.max(maxY - minY, 1e-9);
        const scale = Math.min((w - 2 * pad) / spanX, (h - 2 * pad) / spanY);

        function toScreen(p) {
          return {
            sx: pad + (p.x - minX) * scale,
            sy: pad + (p.y - minY) * scale,
          };
        }

        const screen = points.map(toScreen);

        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--line").trim() || "#6b7c8c";
        ctx.lineWidth = Math.max(1, Math.min(2.5, 40 / Math.sqrt(points.length)));
        ctx.beginPath();
        ctx.moveTo(screen[0].sx, screen[0].sy);
        for (let i = 1; i < screen.length; i++) {
          ctx.lineTo(screen[i].sx, screen[i].sy);
        }
        ctx.stroke();

        const styles = getComputedStyle(document.documentElement);
        const primeColor = styles.getPropertyValue("--prime").trim() || "#e8c47c";
        const collinearColor = styles.getPropertyValue("--prime-collinear").trim() || "#e85d5d";
        const fullLineColor = styles.getPropertyValue("--prime-full-line").trim() || "#4caf7a";
        const highlightCollinear = collinearToggle.checked;
        const highlightFullLine = fullLineToggle.checked;
        const collinear = highlightCollinear
          ? findCollinearPrimeIndices(points, COLLINEAR_MIN)
          : null;
        const fullLine = highlightFullLine
          ? findFullyPrimeLineIndices(points)
          : null;

        if (highlightCollinear) {
          let primeCount = 0;
          for (let i = 0; i < points.length; i++) {
            if (points[i].prime) primeCount += 1;
          }
          highlightStats.textContent =
            "Primes: " + primeCount + " · Red highlights: " + (collinear ? collinear.size : 0);
          highlightStats.classList.add("is-visible");
        } else {
          highlightStats.textContent = "";
          highlightStats.classList.remove("is-visible");
        }

        const radius = Math.max(2.2, Math.min(7, 90 / Math.sqrt(points.length)));
        const baseWidth = Math.max(1.25, radius * 0.35);

        for (let i = 0; i < points.length; i++) {
          if (!points[i].prime) continue;
          const { sx, sy } = screen[i];
          const isFullLine = fullLine && fullLine.has(i);
          const isCollinear = !isFullLine && collinear && collinear.has(i);
          ctx.strokeStyle = isFullLine ? fullLineColor : isCollinear ? collinearColor : primeColor;
          ctx.lineWidth = isFullLine || isCollinear ? baseWidth * 1.75 : baseWidth;
          ctx.beginPath();
          ctx.arc(sx, sy, isFullLine || isCollinear ? radius * 1.15 : radius, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function redraw() {
        if (lastPoints) draw(lastPoints);
      }

      function recalculate() {
        errorEl.textContent = "";
        syncAllStepButtons();
        try {
          const start = parsePositiveInt(fields.start, "Start", 1);
          const edges = parsePositiveInt(fields.edges, "Edges", 3, 100);
          const increment = parsePositiveInt(fields.increment, "Increment", 1);
          const maxIncrements = parsePositiveInt(fields.maxIncrements, "Max increments", 1);
          draw(buildSpiral(start, edges, increment, maxIncrements));
        } catch (err) {
          errorEl.textContent = err.message || String(err);
        }
      }

      function nudge(el, delta) {
        const { min, max } = fieldBounds(el);
        const current = Number(el.value);
        const base = Number.isInteger(current) ? current : min;
        let next = base + delta;
        if (next < min) next = min;
        if (max != null && next > max) next = max;
        el.value = String(next);
        recalculate();
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
      });

      form.addEventListener("input", function (e) {
        if (e.target && e.target.matches('input[type="number"]')) recalculate();
      });

      form.addEventListener("change", function (e) {
        if (e.target === collinearToggle || e.target === fullLineToggle) redraw();
      });

      form.addEventListener("click", function (e) {
        const btn = e.target.closest(".step");
        if (!btn || !form.contains(btn)) return;
        const el = fields[btn.dataset.for];
        if (!el) return;
        nudge(el, Number(btn.dataset.delta));
      });

      window.addEventListener("resize", redraw);
      window.addEventListener("orientationchange", function () {
        setTimeout(redraw, 150);
      });

      recalculate();
    })();
  </script>
</body>
</html>
